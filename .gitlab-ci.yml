default:
  image: node:23
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
      - pnpm-lock.yaml
      - node_modules/

variables:
  NPM_TOKEN: ${CI_JOB_TOKEN}
  BOT_TOKEN: ${BOT_TOKEN}
  BOT_USERNAME: ${BOT_USERNAME}
  BOT_EMAIL: ${BOT_EMAIL}
  CHANGESET_PATH: .changeset
  RELEASE_TAG: ${CI_COMMIT_BRANCH}

.rules-merge-feat: &rules-merge-feat
  if: |
    $CI_PIPELINE_SOURCE == "merge_request_event" && 
    $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"
    $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feat(\/|_|-).+/

.rules-merge-fix: &rules-merge-fix
  if: |
    $CI_PIPELINE_SOURCE == "merge_request_event" && 
    $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"
    $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^((fix|bug))(\/|_|-).+/

.rules-merge: &rules-merge
  - *rules-merge-feat
  - *rules-merge-fix
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    variables:
      BRANCH_SOURCE_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      BRANCH_TARGET_NAME: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

before_script:
  - corepack enable
  - corepack prepare pnpm@10.15.0 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm config set auto-install-peers true
#  - pnpm install --prefer-offline --ignore-scripts --no-frozen-lockfile

stages:
  - run
  - action

build:
  stage: run
  script:
    - pnpm install --prefer-offline --ignore-scripts --no-frozen-lockfile
    - pnpm run build
    - pnpm run start
