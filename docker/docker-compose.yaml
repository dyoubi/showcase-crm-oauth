volumes:
  database:
  cache:

networks:
  stack:
    driver: bridge

services:
  database:
    image: postgres
    restart: always
    networks:
      - stack
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "15432:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@postgres
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_LISTEN_PORT: 80
  cache:
    image: redis/redis-stack
    restart: always
    networks:
      - stack
    ports:
      - "6379:6379"
      - "6380:8001"
    volumes:
      - cache:/data
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    networks:
      - stack
    ports:
      - 5672:5672
      - 15672:15672
